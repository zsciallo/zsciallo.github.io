<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    // The nav bar is the first text painted - hero content is still faded out
    // at that point - so a webfont swapping in under it reads as a flicker on
    // every navigation. Reveal it once Teko, Jersey 10 and VT323 have loaded, or after
    // 1.5s if the font never arrives.
    (function () {
      var el = document.documentElement, ready = function () { el.classList.add('fonts-ready'); };
      el.classList.add('js');
      if (!document.fonts || !document.fonts.load) return ready();
      // Deferred to DOMContentLoaded: before the stylesheet is parsed there is
      // no webfont face to wait on, and the request would resolve instantly.
      addEventListener('DOMContentLoaded', function () {
        Promise.all([document.fonts.load('700 1rem Teko'), document.fonts.load('400 1rem "Jersey 10"'), document.fonts.load('400 1rem VT323')]).then(ready, ready);
      });
      setTimeout(ready, 1500);
    })();
  </script>

  <link rel="icon" type="image/png" href="/server-icon-old-2.png">

  <link rel="preconnect" href="https://api.chromabit.us" crossorigin>
  <link rel="dns-prefetch" href="https://mc-heads.net">

  <title>Player | Chromabit</title>
  <meta name="description"
    content="A ChromaPVP ranked player's season: tier and rating per kit, career totals and recent ranked matches.">
  <!-- One page serves every player (?name=), so it stays out of search results and the sitemap. -->
  <meta name="robots" content="noindex, follow">
  <meta name="author" content="Chromabit Network">
  <link rel="canonical" href="https://chromabit.us/pvp/">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Chromabit Network">
  <meta property="og:url" content="https://chromabit.us/pvp/">
  <meta property="og:title" content="Player | Chromabit">
  <meta property="og:description"
    content="Ranked kit PVP for Java and Bedrock on one ladder. Join at play.chromabit.us">
  <meta property="og:image" content="https://chromabit.us/og-preview.png">
  <meta name="twitter:card" content="summary_large_image">

  <link
    href="https://fonts.googleapis.com/css2?family=Teko:wght@700&family=Jersey+10&family=VT323&display=swap"
    rel="stylesheet">
</head>

<body>

  <script type="module" src="/src/pvpPlayer.jsx"></script>
</body>

</html>
