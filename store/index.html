<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    // The nav bar is the first text painted - hero content is still faded out
    // at that point - so a webfont swapping in under it reads as a flicker on
    // every navigation. Reveal it once Teko has actually loaded, or after
    // 1.5s if the font never arrives.
    (function () {
      var el = document.documentElement, ready = function () { el.classList.add('fonts-ready'); };
      el.classList.add('js');
      if (!document.fonts || !document.fonts.load) return ready();
      // Deferred to DOMContentLoaded: before the stylesheet is parsed there is
      // no Teko face to wait on, and the request would resolve instantly.
      addEventListener('DOMContentLoaded', function () {
        document.fonts.load('400 1rem Teko').then(ready, ready);
      });
      setTimeout(ready, 1500);
    })();
  </script>

  <link rel="icon" type="image/png" href="/server-icon-old-2.png">
  <title>Store | Chromabit SMP</title>
  <meta name="description"
    content="The official Chromabit SMP store. Buy ranks, crate keys, and more for the Chromabit SMP Minecraft server. Every purchase supports the server.">
  <meta name="keywords"
    content="Chromabit SMP store, Minecraft server store, Economy SMP ranks, crate keys, Chromabit shop">
  <meta name="robots" content="index, follow">
  <meta name="author" content="Chromabit SMP">
  <link rel="canonical" href="https://chromabit.us/store/">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Chromabit SMP">
  <meta property="og:url" content="https://chromabit.us/store/">
  <meta property="og:title" content="Store | Chromabit SMP">
  <meta property="og:description"
    content="Buy ranks, crate keys, and more. Every purchase supports Chromabit SMP.">
  <meta property="og:image" content="https://chromabit.us/og-preview.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Store | Chromabit SMP">
  <meta name="twitter:description" content="Buy ranks, crate keys, and more. Every purchase supports Chromabit SMP.">

  <!--
    Four origins this page is certain to talk to, warmed while the HTML is
    still parsing so the DNS lookup, TCP handshake and TLS negotiation are
    already done by the time anything asks for them.

    headless.tebex.io is fetched the moment the store mounts, for the catalog
    and the buyer's basket, and pay.tebex.io is the checkout panel's iframe -
    that one is a cold connection opened at the worst possible moment, right
    after a Buy click, so it is worth paying for up front.

    The font origins are split by design: the stylesheet comes from
    fonts.googleapis.com and the font files it names come from
    fonts.gstatic.com, which is a second connection that otherwise cannot even
    begin until the first has answered. It needs `crossorigin` because fonts
    are fetched in CORS mode, and without the attribute the warmed connection
    is the wrong kind and goes unused.
  -->
  <link rel="preconnect" href="https://headless.tebex.io">
  <link rel="preconnect" href="https://pay.tebex.io">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Teko:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&family=Barlow:wght@400;500&display=swap"
    rel="stylesheet">
</head>

<body>
  <div id="app"></div>
  <script type="module" src="/src/store.jsx"></script>
</body>

</html>
