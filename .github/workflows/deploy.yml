name: Deploy to GitHub Pages

on:
  push:
    branches: [source]
  schedule:
    # Every half hour. GitHub's scheduler is best-effort and can drift 5-30
    # minutes under load, which is fine for floor prices.
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The published branch holds the last market data that deployed cleanly.
      # It is the fallback when the database is unreachable, so a down server
      # means stale prices rather than a failed deploy.
      - name: Check out last deployed data
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: main
          path: .last-deploy

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: npm ci

      # The auction-house documents are generated on the staff bot's box
      # (discord-bot repo) and published as one tarball by the API. The build
      # only downloads and unpacks it, so the website has no database access
      # and no secrets. The fallback below covers the API being down.
      - name: Fetch market data from the API
        id: generate
        continue-on-error: true
        run: |
          set -euo pipefail
          python tools/fetch_market.py
          python tools/fetch_icons.py

      - name: Fall back to last deployed data
        if: steps.generate.outcome != 'success'
        run: |
          set -euo pipefail
          if [ ! -f .last-deploy/market/index.json ]; then
            echo "::error::Could not reach the API and there is no previously deployed data to fall back on."
            exit 1
          fi
          echo "::warning::Could not fetch fresh market data - republishing the last deployed snapshot."
          mkdir -p public/market/items
          cp .last-deploy/market/index.json   public/market/
          cp .last-deploy/market/meta.json    public/market/
          # Added after the first deploys, and the pools and futures tabs both
          # render an empty state without them, so a snapshot that predates
          # them is still worth republishing.
          cp .last-deploy/market/pools.json   public/market/ 2>/dev/null || true
          cp .last-deploy/market/futures.json public/market/ 2>/dev/null || true
          cp .last-deploy/market/ticker.json  public/market/ 2>/dev/null || true
          cp .last-deploy/market/sellers.json public/market/ 2>/dev/null || true
          cp -r .last-deploy/market/items/.   public/market/items/

      - run: npm run build

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          publish_branch: main
          # Market data is rewritten on every run. Keeping history would put a
          # fresh copy of the whole dataset into the branch every half hour, so
          # the published branch is squashed to a single commit instead.
          force_orphan: true
